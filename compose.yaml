services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: eventlens
      POSTGRES_USER: eventlens
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventlens -d eventlens"]
      interval: 5s
      timeout: 3s
      retries: 12

  app:
    build: .
    environment:
      DATABASE_URL: postgresql://eventlens:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/eventlens
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET in .env}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      ETHEREUM_RPC_URL: ${ETHEREUM_RPC_URL:-https://ethereum.publicnode.com}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "npm run db:migrate && npm run start"]

volumes:
  postgres_data:
