name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: eventlens
          POSTGRES_USER: eventlens
          POSTGRES_PASSWORD: eventlens_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eventlens -d eventlens"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://eventlens:eventlens_ci_only@127.0.0.1:5432/eventlens
      BETTER_AUTH_SECRET: ci-only-secret-long-enough-for-better-auth-tests
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      ETHEREUM_RPC_URL: https://ethereum.publicnode.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
